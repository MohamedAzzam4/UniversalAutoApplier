<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Payment Required</title></head>
<body>
  <main>
    <h1>Complete your payment</h1>
    <label for="card_number">Card number</label>
    <input id="card_number" name="card_number" autocomplete="cc-number" placeholder="Card number" required>
    <label for="cvv">CVV</label>
    <input id="cvv" name="card_cvv" autocomplete="cc-csc" placeholder="CVV" required>
    <button type="submit">Pay</button>
  </main>
</body>
</html>
