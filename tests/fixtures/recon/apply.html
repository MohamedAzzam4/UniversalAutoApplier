<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Application - Senior Product Manager</title></head>
<body data-submitted="false">
  <main>
    <h1>Application form</h1>
    <form onsubmit="document.body.dataset.submitted='true'; return false;">
      <label for="first_name">First name *</label>
      <input id="first_name" name="first_name" placeholder="First name" required>
      <label for="last_name">Last name *</label>
      <input id="last_name" name="last_name" placeholder="Last name" required>
      <label for="email">Email *</label>
      <input id="email" name="email" type="email" placeholder="Email" required>
      <label for="resume">Resume / CV</label>
      <input id="resume" name="resume" type="file">
      <button type="submit">Submit application</button>
    </form>
  </main>
</body>
</html>
