name: verify-windows-py314

# Verifies the bootstrap gate on Windows + Python 3.14.
#
# This is the primary target-environment verification requested during review.
# It runs the exact commands a human reviewer would run on their Windows
# machine, so the CI log is directly comparable to a manual test.
#
# Triggers:
#   - push to checkpoint/bootstrap-phase-0 (the branch under review)
#   - pull_request targeting main (so the gate runs before any merge)
#   - manual dispatch (workflow_dispatch) for re-runs on demand
#
# Design note (WQ-6 post-merge hotfix — parallelization):
# Previously this workflow ran all tests in a single job. setup.ps1 alone
# takes ~27 min on Windows (venv creation + pip install + Playwright
# Chromium install + migrations + smoke tests), and the single pytest run
# with Playwright takes ~38 min. Total ~65 min, which hit the 65-min
# timeout.
#
# The workflow now splits verification into two parallel jobs:
#   - windows-core: quality gates + non-Playwright tests (no browser install)
#   - windows-playwright: Playwright browser tests only
#
# Each job sets up only what it needs. The core job skips Playwright
# Chromium installation via setup.ps1 -SkipBrowser, reducing setup from
# ~27 min to ~10 min. The Playwright job installs Chromium but skips the
# smoke tests in setup (they overlap with the core job's test run).
#
# Coverage proof (machine-generated, see PR description):
#   previous non-live total: 1338
#   core total:              1149  (not live and not playwright)
#   playwright total:         189  (not live and playwright)
#   intersection:               0
#   missing:                    0
#   extra:                      0
#   union == previous:       true

"on":
  push:
    branches:
      - checkpoint/bootstrap-phase-0
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Job A: windows-core
  # Quality gates + non-Playwright tests (unit, contract, integration).
  # Installs Chromium because integration tests (test_submission_harness,
  # test_api, test_pipeline_worker) launch subprocesses that use Playwright
  # even though they are not marked as 'playwright' tests.
  # ------------------------------------------------------------------
  windows-core:
    name: Windows Core (integration tests need Chromium)
    runs-on: windows-latest
    # setup.ps1 with Chromium install takes ~27 min on Windows. The core
    # test suite (not live, not playwright) takes ~14 min. Total ~41 min.
    # 55 min provides headroom.
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify LF line endings
        shell: pwsh
        run: |
          Write-Host "=== Verifying LF line endings ==="
          $files = @(
            "src/universal_auto_applier/__init__.py",
            "scripts/setup.ps1",
            "tests/conftest.py"
          )
          foreach ($f in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($f)
            $hasCrlf = $false
            for ($i = 0; $i -lt $bytes.Length - 1; $i++) {
              if ($bytes[$i] -eq 13 -and $bytes[$i+1] -eq 10) {
                $hasCrlf = $true
                break
              }
            }
            if ($hasCrlf) {
              Write-Error "FAIL: $f has CRLF line endings (expected LF)"
              exit 1
            } else {
              Write-Host "OK: $f has LF line endings"
            }
          }

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Show Python version
        shell: pwsh
        run: |
          python --version
          python -c "import sys; print(f'Python {sys.version}')"

      - name: Remove stale venv and data
        shell: pwsh
        run: |
          if (Test-Path .venv) { Remove-Item -Recurse -Force .venv }
          if (Test-Path .uaa_data) { Remove-Item -Recurse -Force .uaa_data }

      - name: Run setup.ps1 (install Chromium for integration tests, skip smoke tests)
        shell: pwsh
        run: |
          # Integration tests (test_submission_harness, test_api, test_pipeline_worker)
          # launch subprocesses that use Playwright. They need Chromium installed
          # even though they are not marked as 'playwright' tests.
          .\scripts\setup.ps1 -PythonExecutable python -SkipSmokeTests

      # ------------------------------------------------------------------
      # Quality gates — each runs exactly once.
      # ------------------------------------------------------------------

      - name: Ruff check (src tests migrations)
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m ruff check src tests migrations

      - name: Ruff format --check (src tests migrations)
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m ruff format --check src tests migrations

      - name: Pyright
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pyright

      # ------------------------------------------------------------------
      # Core test suite — non-Playwright, non-live.
      # This is the single authoritative run for unit/contract/integration.
      # ------------------------------------------------------------------

      - name: Pytest core (not live, not playwright)
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pytest -m "not live and not playwright" -q

      # ------------------------------------------------------------------
      # Contract ResourceWarning gate — a focused re-run of the contract
      # tests to prove the filterwarnings = ["error"] config is wired
      # correctly. Lightweight and distinct from the full suite.
      # ------------------------------------------------------------------

      - name: Contract tests (ResourceWarning gate)
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pytest tests\contract\test_migrations.py -q

      # ------------------------------------------------------------------
      # Deliberate ResourceWarning proof — writes a temp test that emits
      # a ResourceWarning, asserts pytest FAILS (proving the filter is
      # active), then cleans up the temp file.
      # ------------------------------------------------------------------

      - name: Prove ResourceWarning is treated as error
        shell: pwsh
        run: |
          @"
          import warnings
          def test_resourcewarning_is_error():
              warnings.warn('deliberate', ResourceWarning)
          "@ | Out-File -FilePath tests\test_rw_temp.py -Encoding utf8

          $output = .\.venv\Scripts\python.exe -m pytest tests\test_rw_temp.py -q 2>&1
          $exitCode = $LASTEXITCODE
          Write-Host $output
          Remove-Item tests\test_rw_temp.py -Force

          if ($exitCode -eq 0) {
            Write-Error "FAIL: ResourceWarning was NOT treated as error"
            exit 1
          } else {
            Write-Host "OK: ResourceWarning is correctly treated as error"
            $global:LASTEXITCODE = 0
          }

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== Windows Core Verification Summary ==="
          Write-Host "Python: $(python --version)"
          Write-Host "Commit: ${{ github.sha }}"
          $jobStatus = "${{ job.status }}"
          if ($jobStatus -eq 'success') {
            Write-Host "RESULT: CORE GATES PASSED"
          } else {
            Write-Host "RESULT: CORE GATES FAILED - see logs above"
          }

  # ------------------------------------------------------------------
  # Job B: windows-playwright
  # Playwright browser tests only. Installs Chromium but does not run
  # the smoke tests in setup.ps1 (they overlap with the core job).
  # ------------------------------------------------------------------
  windows-playwright:
    name: Windows Playwright
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Show Python version
        shell: pwsh
        run: |
          python --version
          python -c "import sys; print(f'Python {sys.version}')"

      - name: Remove stale venv and data
        shell: pwsh
        run: |
          if (Test-Path .venv) { Remove-Item -Recurse -Force .venv }
          if (Test-Path .uaa_data) { Remove-Item -Recurse -Force .uaa_data }

      - name: Run setup.ps1 (with Playwright, skip smoke tests)
        shell: pwsh
        run: |
          .\scripts\setup.ps1 -PythonExecutable python -SkipSmokeTests

      # ------------------------------------------------------------------
      # Playwright test suite — the complete Playwright collection.
      # Uses -m "not live and playwright" to select only Playwright tests
      # that are not live (opt-in external). This is the single
      # authoritative Playwright run.
      # ------------------------------------------------------------------

      - name: Pytest Playwright (not live, playwright only)
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pytest -m "not live and playwright" -q

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== Windows Playwright Verification Summary ==="
          Write-Host "Python: $(python --version)"
          Write-Host "Commit: ${{ github.sha }}"
          $jobStatus = "${{ job.status }}"
          if ($jobStatus -eq 'success') {
            Write-Host "RESULT: PLAYWRIGHT GATES PASSED"
          } else {
            Write-Host "RESULT: PLAYWRIGHT GATES FAILED - see logs above"
          }
